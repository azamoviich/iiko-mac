<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="iiko-mac: настоящий BackOffice на Mac без виртуальной машины">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#12060a"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="0.55" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .cur { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1280" height="480" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="480" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="479" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- title -->
  <text x="72" y="118" class="mono" font-size="20" fill="#8b93a7" letter-spacing="4">ТОЛЬКО ДЛЯ WINDOWS? УЖЕ НЕТ.</text>
  <text x="68" y="232" class="mono" font-size="118" font-weight="800" fill="url(#hot)" letter-spacing="-3">iiko-mac</text>
  <text x="72" y="284" class="mono" font-size="26" fill="#e8ebf2">Настоящий BackOffice. На Mac.</text>
  <text x="72" y="318" class="mono" font-size="26" fill="#e8ebf2">Без виртуальной машины.</text>

  <!-- stat chips -->
  <g class="mono" font-size="17">
    <rect x="72" y="348" width="194" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="169" y="374" text-anchor="middle" fill="#ffd166">~4 ГБ вместо 70</text>
    <rect x="280" y="348" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="365" y="374" text-anchor="middle" fill="#ffd166">одна команда</text>
    <rect x="464" y="348" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="539" y="374" text-anchor="middle" fill="#ffd166">бесплатно</text>
  </g>

  <!-- terminal -->
  <g transform="translate(700 92)">
    <rect width="508" height="300" rx="14" fill="#07080b" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="26" cy="24" r="6.5" fill="#ff5f57"/>
    <circle cx="48" cy="24" r="6.5" fill="#febc2e"/>
    <circle cx="70" cy="24" r="6.5" fill="#28c840"/>
    <line x1="0" y1="46" x2="508" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
    <g class="mono" font-size="15.5">
      <text x="24" y="80" fill="#8b93a7">$ <tspan fill="#e8ebf2">./install.sh 9.2.7014.0 both</tspan></text>
      <text x="24" y="112" fill="#4fd1c5">==&gt; <tspan fill="#c6ccd9">Загрузка Wine 11.18</tspan></text>
      <text x="24" y="138" fill="#4fd1c5">==&gt; <tspan fill="#c6ccd9">Установка .NET Framework 4.8</tspan></text>
      <text x="24" y="164" fill="#4fd1c5">==&gt; <tspan fill="#c6ccd9">Установка загрузчика .NET</tspan></text>
      <text x="24" y="190" fill="#4fd1c5">==&gt; <tspan fill="#c6ccd9">Загрузка iikoOffice с сервера iiko</tspan></text>
      <text x="24" y="216" fill="#4fd1c5">==&gt; <tspan fill="#c6ccd9">iikoOffice установлен</tspan></text>
      <text x="24" y="242" fill="#4fd1c5">==&gt; <tspan fill="#c6ccd9">iikoChain установлен</tspan></text>
      <text x="24" y="274" fill="#28c840">==&gt; Готово.<tspan class="cur" fill="#e8ebf2"> ▋</tspan></text>
    </g>
  </g>

  <text x="72" y="440" class="mono" font-size="15" fill="#5c6477">неофициально · не связано с iiko · внутри нет чужих файлов</text>
</svg>
